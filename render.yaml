services:
  - type: web
    name: speech-to-text
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: speech-db
          property: connectionString
      - key: WHISPER_MODEL
        value: tiny
databases:
  - name: speech-db
    plan: free
